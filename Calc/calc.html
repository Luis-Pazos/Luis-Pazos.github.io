<body>
<div class="container-fluid bg-primary">
        <div class="row">
            <div class="col-md text-center">
                 <header class="py-3">
                     <!-- place navbar here -->
                     <h2 class="text-center text-warning"><b>CALCULADORA CONVERSORA</b></h2>
                     <h2 class="text-center text-warning"><b>DE UNIDADES MOLONA</b></h2>

                 </header>
        <br><br>    

        <form>
            <label class="text-white"><strong>MILIGRAMOS DEL FÁRMACO:</strong></label> 
            <input id="ml-gr" inputmode="decimal" type="number" maxlength="3" name="ml-gr" pattern="[0-9]{0,4}" required autofocus ><br><br>
            <label class="text-white"><strong>KILOS PACIENTE:</strong></label>
            <input id="kilos" inputmode="decimal" type="number" maxlength="3" name="kilos" pattern="[0-9]{0,4}" required ><br><br>
            <label class="text-white"><strong>MILILITROS SUERO:</strong></label>
            <input id="ml-l" inputmode="decimal" type="number" maxlength="3" name="ml-l" pattern="[0-9]{0,4}" required ><br><br>
            <div id="mk">
             <label id="microgramoskilominuto" class="text-white"><strong>MICROGRAMOS POR KILO/MINUTO:</strong></label>
              <input id="mg-km" inputmode="decimal" type="number" maxlength="4" name="mg-km" pattern="[0-9]{0,4}" required ><br><br>
            </div>
              <div id="mh">
              <label id="mililitroshora" class="text-white"><strong>MILILITROS HORA:</strong></label>
              <input id="ml-hora" inputmode="decimal" type="number" maxlength="4" name="ml-hora" pattern="[0-9]{0,4}" required ><br><br>
            </div>
        </form>

            <script>
              const campoTexto = document.getElementById('ml-hora');
              const campoTexto2 = document.getElementById('mg-km');
              function actualizarBoton(){
                if (campoTexto.value.trim() ===''){
                  btn1.disabled = false;
                } else {
                  btn1.disabled = true;
                }
                if (campoTexto2.value.trim() ===''){
                  btn2.disabled = false;
                } else {
                  btn2.disabled = true;
                }
              }
              campoTexto.addEventListener('input', actualizarBoton);
              campoTexto2.addEventListener('input', actualizarBoton);
              actualizarBoton();

                    function calc(){

                    var mlgr = document.getElementById("ml-gr").valueAsNumber;
                    var kilos = document.getElementById("kilos").valueAsNumber;
                    var mll = document.getElementById("ml-l").valueAsNumber;
                    var mgkm = document.getElementById("mg-km").valueAsNumber;
                    var mlh = document.getElementById("ml-hora").valueAsNumber;

                    var mlgr2 = mlgr.toString();
                    var kilos2 = kilos.toString();
                    var mll2 = mll.toString();
                    var mgkm2 = mgkm.toString();
                    var mlh2 = mlh.toString();

                    var mgkgmin = (mgkm * kilos * 60) /1000; //miligramos kilo minuto
                    var solucion1 = (mll * mgkgmin) /mlgr; // mililitros hora
                    var solredondeada = solucion1.toFixed(2);
                   
                    if ((isNaN(mlgr2)) && (isNaN(kilos2)) && (isNaN(mll2)) && (isNaN(mgkm2)))
                      {
                        //Si todos los campos están en blanco recarga, sino deja seguir rellenando
                        alert ("Todos los campos están en blanco!!");
                        location.reload();
                      } else  if ((isNaN(mlgr2)) || (isNaN(kilos2)) || (isNaN(mll2)) || (isNaN(mgkm2)))
                      {
                        alert ("No puede haber campos en blanco, salvo el que se quiere hallar!!");
                        location.reload();
                    } else if (!isNaN(mlh)) {
                      alert ("No puedes escribir en ese campo, ya que es el dato que quieres calcular!!")
                      location.reload();
                      //calc();
                    }
                                
                      document.getElementById("demo").innerHTML = "La solución es <br>"+solredondeada+ "<br> mililitros hora<br>";
                        
                       var b=document.getElementById('botones');
                       b.style.display = 'none';
                       var c=document.getElementById('mh');
                       c.style.display = 'none';

                      document.getElementById("demo3").innerHTML = '<button onclick=location.reload()>NUEVO CÁLCULO</button>';
                                }

            function calc2(){

              var mgkm = document.getElementById("mg-km").valueAsNumber;
              var mlh = document.getElementById("ml-hora").valueAsNumber;

                    var mgkgmin = (mgkm * kilos * 60) /1000; //miligramos kilo minuto

                    //var microgramoskm = (solucion1 * mlgr2 * 1000)/(mll2 * kilos2 * 60);

                      // Formula para hallar los microgramos kilo minuto:
                      // (mililitros hora x dosis fármaco (mlgr2) x 1000)

                      //  mililitros suero (mll2) x kilos paciente (kilos2) x 60

                      // (solucion x mlgr2x1000)/(mll2xkilos2x60)

                      var solredondeada = solucion1.toFixed(2);

              var microgramoskm = (mlh2 * mlgr2 * 1000)/(mll2 * kilos2 * 60);
              var solredondeada2 = microgramoskm.toFixed(2);
                   
                 
                   if ((isNaN(mlgr2)) && (isNaN(kilos2)) && (isNaN(mll2)) && (isNaN(mgkm2)))
                     {

                       alert ("Todos los campos están en blanco!!");
                       location.reload();
                    // } else  if ((isNaN(mlgr2)) || (isNaN(kilos2)) || (isNaN(mll2)) || (isNaN(mgkm2)))
                    // {
                    } else  if ((isNaN(mlgr2)) || (isNaN(kilos2)) || (isNaN(mll2)) || (isNaN(mlh2)))
                    {
                       alert ("No puede haber campos en blanco, salvo el que se quiere hallar!!");
                       location.reload();;
                     
                   } else if (!isNaN(mgkm)) {
                      alert ("No puedes escribir en ese campo, ya que es el dato que quieres calcular!!")
                      location.reload();
                      //calc();
                    }  
                   
                   {
   
                       document.getElementById("demo").innerHTML = "La solución es <br>"+solredondeada2+ "<br> microgramos kilo minuto";
                       
                       var b=document.getElementById('botones');
                       b.style.display = 'none';

                       b.style.display = 'none';

                       c.style.display = 'none';

                       document.getElementById("demo").innerHTML = "La solución es <br>"+solredondeada2+ "<br> microgramos kilo minuto<br>";
  
                       document.getElementById("demo3").innerHTML = '<button onclick=location.reload()>NUEVO CÁLCULO</button>';

                   }
           }

            </script>

            <br>
            <div id="botones">
            <button id="boton1" onclick="calc()">CALCULAR MILILITROS HORA</button>
            <br><br>
